<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom</title>
    <style>
        :root {
            --bg-glass: rgba(30, 30, 30, 0.65);
            --bg-solid: #1e1e1e;
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        body.light-theme {
            --bg-glass: rgba(255, 255, 255, 0.65);
            --bg-solid: #f5f5f5;
            --border-glass: rgba(0, 0, 0, 0.15);
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            background-image: url('https://raw.githubusercontent.com/jcdevsman/juliansgames/refs/heads/main/i/background.png');
            background-size: cover;
            background-position: center;
            transition: color 0.3s;
        }

        /* The Dock */
        .dock-container {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            z-index: 9998;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .dock-container.hidden {
            transform: translate(-50%, 100px);
            opacity: 0;
            pointer-events: none;
        }

        .dock-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, margin 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.1);
        }
        
        body.light-theme .dock-icon { background: rgba(0,0,0,0.05); }

        .dock-icon:hover {
            transform: scale(1.2) translateY(-10px);
            margin: 0 10px;
        }

        /* macOS Spotlight Search */
        #spotlight-wrapper {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -20px);
            width: 90%;
            max-width: 620px;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: var(--bg-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #spotlight-wrapper.active {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: all;
        }

        .spotlight-top-bar {
            display: flex;
            align-items: center;
            padding: 0 1.2rem;
            border-bottom: 1px solid var(--border-glass);
        }

        .spotlight-magnifier {
            font-size: 1.3rem;
            margin-right: 0.8rem;
            opacity: 0.6;
        }

        .spotlight-input {
            width: 100%;
            box-sizing: border-box;
            padding: 1.1rem 0;
            font-size: 1.4rem;
            background: transparent;
            color: var(--text-main);
            border: none;
            outline: none;
        }

        .spotlight-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .spotlight-results {
            max-height: 380px;
            overflow-y: auto;
            display: block;
            padding: 6px;
        }

        .spotlight-item {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.1s, color 0.1s;
            color: var(--text-main);
        }

        .spotlight-item:hover {
            background: #0062ed;
            color: #ffffff;
        }

        .spotlight-item img { 
            width: 32px; 
            height: 32px; 
            border-radius: 6px; 
            object-fit: cover; 
        }

        .spotlight-item span { 
            font-size: 1rem; 
            font-weight: 400; 
        }

        /* Window System */
        .os-window {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 800px;
            height: 500px;
            background: var(--bg-solid);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: none; 
            flex-direction: column;
            overflow: hidden;
            resize: both; 
        }

        .os-window.animating {
            transition: width 0.25s ease, height 0.25s ease, top 0.25s ease, left 0.25s ease, border-radius 0.25s ease;
        }

        /* True Full Screen Mode */
        .os-window.maximized {
            top: 0 !important; 
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            resize: none;
            box-shadow: none;
        }

        .os-window.maximized .window-header {
            display: none !important;
        }

        .os-window.maximized .browser-toolbar {
            display: none !important;
        }

        .window-header {
            height: 38px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            cursor: grab;
            user-select: none;
            border-bottom: 1px solid var(--border-glass);
        }

        .window-header:active { cursor: grabbing; }

        .traffic-lights {
            display: flex;
            gap: 8px;
            width: 60px;
        }

        .light {
            width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
        }
        .light.red { background: #ff5f56; }
        .light.yellow { background: #ffbd2e; }
        .light.green { background: #27c93f; }

        .window-title {
            flex-grow: 1;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            margin-right: 60px; 
        }

        .browser-toolbar {
            height: 40px;
            background: var(--bg-solid);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 0.5rem;
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .toolbar-btn:hover { background: rgba(255,255,255,0.1); }
        body.light-theme .toolbar-btn:hover { background: rgba(0,0,0,0.1); }

        .window-content {
            flex-grow: 1;
            position: relative;
            background: #fff; 
            display: flex;
            flex-direction: column;
        }

        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            display: block;
        }

        .settings-content {
            padding: 2rem;
            color: var(--text-main);
            background: var(--bg-solid);
            height: 100%;
            box-sizing: border-box;
        }

        .btn-theme {
            background: var(--text-main);
            color: var(--bg-solid);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="spotlight-wrapper">
        <div class="spotlight-top-bar">
            <span class="spotlight-magnifier">🔍</span>
            <input type="text" id="spotlight-input" class="spotlight-input" placeholder="Search apps and games..." autocomplete="off" spellcheck="false">
        </div>
        <div id="spotlight-results" class="spotlight-results"></div>
    </div>

    <div id="app-window" class="os-window">
        <div class="window-header" id="app-header">
            <div class="traffic-lights" onmousedown="event.stopPropagation()">
                <div class="light red" onclick="closeWindow('app-window', true)"></div>
                <div class="light yellow" onclick="minimizeWindow('app-window')"></div>
                <div class="light green" onclick="maximizeWindow('app-window')"></div>
            </div>
            <div class="window-title" id="app-title">Application</div>
        </div>
        
        <div id="browser-toolbar" class="browser-toolbar" style="display: none;">
            <button class="toolbar-btn" onclick="browserBack()" title="Go Back">◀</button>
            <button class="toolbar-btn" onclick="browserRefresh()" title="Refresh">↻</button>
            <button class="toolbar-btn" onclick="browserHome()" title="Home">🏠</button>
        </div>

        <div class="window-content">
            <iframe id="app-frame" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups"></iframe>
        </div>
    </div>

    <div id="settings-window" class="os-window" style="width: 400px; height: 300px;">
        <div class="window-header" id="settings-header">
            <div class="traffic-lights" onmousedown="event.stopPropagation()">
                <div class="light red" onclick="closeWindow('settings-window', false)"></div>
                <div class="light yellow" onclick="minimizeWindow('settings-window')"></div>
                <div class="light green" style="opacity: 0.5; cursor: default;"></div>
            </div>
            <div class="window-title">System Settings</div>
        </div>
        <div class="settings-content">
            <h2>Appearance</h2>
            <p>Change the system tint.</p>
            <button class="btn-theme" onclick="toggleTheme()">Toggle Light/Dark Mode</button>
        </div>
    </div>

    <div id="dock" class="dock-container">
        <div class="dock-icon" title="Browser" onclick="launchApp('Browser', 'https://www.google.com/webhp?igu=1')">
            🌐
        </div>
        <div class="dock-icon" title="System Settings" onclick="openSettings()">
            ⚙️
        </div>
    </div>

    <script>
        const gamesDatabase = [
            { id: 1, title: "GTA: VC (lustful, i personally would not play)", icon: "https://raw.githubusercontent.com/jcdevsman/juliansgames/refs/heads/main/i/vice-city/icon.png", url: "https://raw.githubusercontent.com/jcdevsman/juliansgames/refs/heads/main/g/gtavc.html" },
            { id: 2, title: "BitLife", icon: "https://raw.githubusercontent.com/jcdevsman/juliansgames/refs/heads/main/i/bitlife/bitlife.png", url: "https://raw.githubusercontent.com/jcdevsman/juliansgames/refs/heads/main/g/bitlife.html" },
            { id: 3, title: "Tetris Clone", icon: "https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/css/css.png", url: "https://raw.githubusercontent.com/golang/example/refs/heads/master/appengine-hello/static/index.html" }
        ];

        let topZIndex = 100;
        let currentBrowserUrl = 'https://www.google.com/webhp?igu=1';

        const spotlightWrapper = document.getElementById('spotlight-wrapper');
        const spotlightInput = document.getElementById('spotlight-input');
        const spotlightResults = document.getElementById('spotlight-results');

        function renderSpotlightList(items) {
            spotlightResults.innerHTML = '';
            if (items.length === 0) {
                spotlightResults.innerHTML = `<div class="spotlight-item" style="cursor: default; color: var(--text-muted); justify-content: center;"><span>No Results Found</span></div>`;
                return;
            }

            items.forEach((game, index) => {
                const item = document.createElement('div');
                item.className = 'spotlight-item' + (index === 0 ? ' selected' : '');
                item.onclick = () => {
                    launchApp(game.title, game.url, true);
                    toggleSearch();
                };
                item.innerHTML = `<img src="${game.icon}"><span>${game.title}</span>`;
                spotlightResults.appendChild(item);
            });
        }

        function toggleSearch() {
            if (spotlightWrapper.classList.contains('active')) {
                spotlightWrapper.classList.remove('active');
                spotlightInput.blur();
                spotlightInput.value = '';
                spotlightResults.innerHTML = '';
            } else {
                spotlightWrapper.classList.add('active');
                spotlightInput.focus();
                renderSpotlightList(gamesDatabase);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Alt' && !e.repeat) {
                e.preventDefault(); 
                toggleSearch();
            }
            if (e.key === 'Escape' && spotlightWrapper.classList.contains('active')) {
                toggleSearch();
            }
        });

        spotlightInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = gamesDatabase.filter(g => g.title.toLowerCase().includes(term));
            renderSpotlightList(filtered);
        });

        function bringToFront(windowId) {
            topZIndex++;
            document.getElementById(windowId).style.zIndex = topZIndex;
        }

        function closeWindow(windowId, killApp = false) {
            const win = document.getElementById(windowId);
            win.style.display = 'none';
            win.classList.remove('maximized', 'animating');
            
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }

            if (windowId === 'app-window') {
                document.getElementById('dock').classList.remove('hidden');
            }

            if(killApp) {
                const frame = document.getElementById('app-frame');
                frame.removeAttribute('src');
                frame.removeAttribute('srcdoc');
                document.getElementById('app-title').innerText = "Application";
                document.getElementById('browser-toolbar').style.display = 'none';
            }
        }

        function minimizeWindow(windowId) {
            document.getElementById(windowId).style.display = 'none';
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            if (windowId === 'app-window') {
                document.getElementById('dock').classList.remove('hidden');
            }
        }

        function maximizeWindow(windowId) {
            const win = document.getElementById(windowId);
            win.classList.add('animating');
            win.classList.toggle('maximized');
            bringToFront(windowId);

            const dock = document.getElementById('dock');
            if (win.classList.contains('maximized')) {
                dock.classList.add('hidden');
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log("Full screen blocked by browser policy:", err);
                    });
                }
            } else {
                dock.classList.remove('hidden');
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
            }

            setTimeout(() => win.classList.remove('animating'), 250);
        }

        // Listen for user exiting native browser full screen (e.g. pressing ESC on keyboard)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                const appWindow = document.getElementById('app-window');
                const settingsWindow = document.getElementById('settings-window');
                const dock = document.getElementById('dock');

                // If windows are maximized, un-maximize them and bring back the dock
                if (appWindow.classList.contains('maximized')) {
                    appWindow.classList.remove('maximized');
                }
                if (settingsWindow.classList.contains('maximized')) {
                    settingsWindow.classList.remove('maximized');
                }
                dock.classList.remove('hidden');
            }
        });

        async function launchApp(title, url, isRawGame = false) {
            const win = document.getElementById('app-window');
            const frame = document.getElementById('app-frame');
            const toolbar = document.getElementById('browser-toolbar');
            const currentTitle = document.getElementById('app-title').innerText;
            
            win.style.display = 'flex';
            bringToFront('app-window');

            if (currentTitle === title) return;

            document.getElementById('app-title').innerText = title;
            frame.removeAttribute('src');
            frame.removeAttribute('srcdoc');

            if (title === 'Browser') {
                toolbar.style.display = 'flex';
                currentBrowserUrl = url;
            } else {
                toolbar.style.display = 'none';
            }

            if (isRawGame) {
                try {
                    const res = await fetch(url);
                    frame.srcdoc = await res.text();
                } catch (e) {
                    frame.srcdoc = `<h2>Error loading game</h2>`;
                }
            } else {
                frame.src = url;
            }
        }

        function browserBack() {
            const frame = document.getElementById('app-frame');
            try {
                frame.contentWindow.history.back();
            } catch (e) {
                browserHome();
            }
        }

        function browserRefresh() {
            const frame = document.getElementById('app-frame');
            frame.src = frame.src; 
        }

        function browserHome() {
            const frame = document.getElementById('app-frame');
            frame.src = currentBrowserUrl;
        }

        function openSettings() {
            const win = document.getElementById('settings-window');
            win.style.display = 'flex';
            bringToFront('settings-window');
        }

        function makeDraggable(windowId, headerId) {
            const win = document.getElementById(windowId);
            const header = document.getElementById(headerId);
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            header.onmousedown = (e) => {
                if (win.classList.contains('maximized')) return;
                e.preventDefault();
                bringToFront(windowId);
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                win.style.pointerEvents = "none"; 
            };

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                win.style.top = (win.offsetTop - pos2) + "px";
                win.style.left = (win.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                win.style.pointerEvents = "auto";
            }
            
            win.addEventListener('mousedown', () => bringToFront(windowId));
        }

        makeDraggable('app-window', 'app-header');
        makeDraggable('settings-window', 'settings-header');

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }
    </script>
</body>
</html>
