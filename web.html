<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],

    <style>
        /* Custom Clean Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #2a3042; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d2ff; }

        /* Smooth UI transitions */
        .oasis-card {
            background: #1c202c;
            border: 1px solid #2a3042;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .oasis-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 210, 255, 0.35);
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6), 0 0 15px 0px rgba(0, 210, 255, 0.15);
        }

        .sidebar-link { transition: all 0.15s ease-in-out; }
        .sidebar-link.active {
            background: rgba(0, 210, 255, 0.08);
            color: #00d2ff;
            border-right: 3px solid #00d2ff;
            font-weight: 600;
        }

        /* Gradient accent utilities */
        .btn-gradient {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: #0f1117;
        }
        .btn-gradient:hover { filter: brightness(1.1); }
        .text-gradient {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Fullscreen API styles */
        #modalContainer:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            border: none !important;
        }
        #modalContainer:fullscreen .modal-header {
            display: none !important;
        }
        
        /* Safari Fullscreen Support */
        #modalContainer:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            border: none !important;
        }
        #modalContainer:-webkit-full-screen .modal-header {
            display: none !important;
        }
        
        /* Iframe loading overlay spinner */
        .loader-ring {
            border: 3px solid rgba(0, 210, 255, 0.1);
            border-top: 3px solid #00d2ff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-oasis-bg text-slate-100 font-sans min-h-full flex antialiased selection:bg-cyan-500 selection:text-slate-950">

    <!-- MOBILE HEADER -->

    <div id="customUrlModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200 p-4">
        <div class="w-full max-w-md bg-oasis-card rounded-2xl border border-oasis-border p-6 space-y-5 shadow-2xl" onclick="event.stopPropagation()">

                    <input type="text" id="customGameTitle" placeholder="how to get robuc hack 2026 for iphone 18 pro real working delta" class="w-full bg-oasis-bg text-xs text-slate-200 px-3 py-2 rounded-xl border border-oasis-border focus:border-cyan-400 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-mono text-oasis-muted mb-1">Path or URL</label>
                    <input type="text" id="customGameUrl" placeholder="https://..." class="w-full bg-oasis-bg text-xs font-mono text-slate-200 px-3 py-2 rounded-xl border border-oasis-border focus:border-cyan-400 outline-none">

            </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ==========================================================================
           1. DATABASE OF GAMES
           ========================================================================== */
        const DEFAULT_THUMB = "https://thumbs.dreamstime.com/b/temporary-rubber-stamp-over-white-background-86664158.jpg";
        const SR_THUMB = "https://timeandclock.net/i/sr.avif";
        const DR_THUMB = "https://timeandclock.net/i/dr.webp";
        const GTA_THUMB = "https://timeandclock.net/i/vice-city/capsule_616x353.jpg";
        

        const GAMES_DATABASE = [
            { id: 'sr', title: 'Soccer Random', path: '/g/sr.html', category: 'Sports', icon: 'fa-futbol', thumb: SR_THUMB, description: 'Bouncy 2-player ragdoll soccer physics with randomized fields.', rank: 1 },
            { id: 'dr', title: 'Drive Made', path: '/g/drivemading.html', category: 'Driving', icon: 'fa-football', thumb: DR_THUMB, description: 'Classic pixel football management game.', rank: 2 },
            { id: 'br', title: 'Deltarune (trust)', path: '/g/gtavc.html', category: 'Arcade', icon: 'fa-basketball', thumb: DEFAULT_THUMB, description: 'Hilarity ensues in this bouncy 2-player basketball game.', rank: 3 },
            { id: 'dm', title: 'Drive Mad', path: '/g/dm.html', category: 'Driving', icon: 'fa-car-side', thumb: DEFAULT_THUMB, description: 'Challenging monster truck physics racing.', rank: 4 },
            { id: 'moto', title: 'Moto X3M', path: '/g/moto.html', category: 'Driving', icon: 'fa-motorcycle', thumb: DEFAULT_THUMB, description: 'Action-packed stunt bike racing.', rank: 5 },
            { id: 'subway', title: 'Subway Surfers', path: '/g/subway.html', category: 'Arcade', icon: 'fa-train', thumb: DEFAULT_THUMB, description: 'Endless runner classic. Dodge trains and barriers.', rank: 6 },
            { id: 'slope', title: 'Slope 3D', path: '/g/slope.html', category: 'Arcade', icon: 'fa-bowling-ball', thumb: DEFAULT_THUMB, description: 'Fast-paced 3D ball runner down steep, narrow ramps.', rank: 7 }
        ];

        /* ==========================================================================
           2. APP STATE
           ========================================================================== */
        let state = {
            category: 'All',
            searchQuery: '',
            sortBy: 'popular',
            favorites: JSON.parse(localStorage.getItem('oasis_favs') || '[]'),
            audioEnabled: localStorage.getItem('oasis_audio') !== 'false',
            activeModalGameId: null
        };

        /* ==========================================================================
           3. WEB AUDIO API SYNTHESIZER
           ========================================================================== */
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            if (!state.audioEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(420, now + 0.03);
                    gain.gain.setValueAtTime(0.015, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                    osc.start(now); osc.stop(now + 0.03);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(580, now);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.05);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'open') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.08);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                }
            } catch (e) {}
        }

        function toggleAudio() {
            state.audioEnabled = !state.audioEnabled;
            localStorage.setItem('oasis_audio', state.audioEnabled);
            updateAudioUI();
            if (state.audioEnabled) playSound('click');
        }

        function updateAudioUI() {
            const dot = document.getElementById('soundToggleDot');
            const btn = document.getElementById('soundToggleSwitch');
            const icon = document.getElementById('soundIcon');
            if (state.audioEnabled) {
                dot.style.transform = 'translateX(0px)';
                btn.className = 'relative w-9 h-5 rounded-full bg-gradient-to-r from-cyan-400 to-blue-600 transition-all';
                icon.className = 'fa-solid fa-volume-high text-cyan-400 text-xs';
            } else {
                dot.style.transform = 'translateX(-16px)';
                btn.className = 'relative w-9 h-5 rounded-full bg-oasis-border transition-all';
                icon.className = 'fa-solid fa-volume-xmark text-oasis-muted text-xs';
            }
        }

        /* ==========================================================================
           4. RENDERING & FILTERING
           ========================================================================== */
        function init() {
            updateAudioUI();
            updateFavBadge();
            renderGames();
            setupSearch();
            setupModalOverlays();
        }

        function updateFavBadge() {
            document.getElementById('favCountBadge').textContent = state.favorites.length;
        }

        function filterByCategory(cat) {
            playSound('click');
            state.category = cat;
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            const nav = document.getElementById(`nav-${cat}`);
            if (nav) nav.classList.add('active');
            
            document.getElementById('activeCategoryTitle').textContent = cat === 'Favorites' ? 'My Favorites' : `${cat} Games`;
            const sidebar = document.getElementById('sidebar');
            if(window.innerWidth < 1024) sidebar.classList.add('-translate-x-full');
            renderGames();
        }

        function setSort(val) {
            playSound('click');
            state.sortBy = val;
            renderGames();
        }

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            const noRes = document.getElementById('noResults');
            
            let filtered = GAMES_DATABASE.filter(g => {
                let matchCat = state.category === 'All' || (state.category === 'Favorites' ? state.favorites.includes(g.id) : g.category === state.category);
                let matchSearch = g.title.toLowerCase().includes(state.searchQuery.toLowerCase()) || g.category.toLowerCase().includes(state.searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            filtered.sort((a, b) => state.sortBy === 'alphabetical' ? a.title.localeCompare(b.title) : a.rank - b.rank);
            document.getElementById('activeCountBadge').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noRes.classList.remove('hidden');
                noRes.classList.add('flex');
                return;
            }
            noRes.classList.add('hidden');
            noRes.classList.remove('flex');

            grid.innerHTML = filtered.map(game => {
                const isFav = state.favorites.includes(game.id);
                return `
                    <div class="oasis-card rounded-2xl overflow-hidden flex flex-col group relative" onmouseenter="playSound('hover')">
                        <!-- Thumbnail Area -->
                        <div class="relative h-44 bg-oasis-sidebar overflow-hidden cursor-pointer" onclick="launchGame('${game.id}')">
                            <img src="${game.thumb}" alt="${game.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-oasis-card via-transparent to-transparent opacity-90 pointer-events-none"></div>
                            
                            <!-- Category Badge -->
                            <span class="absolute top-3 left-3 text-[10px] font-mono bg-oasis-sidebar/90 border border-oasis-border px-2 py-1 rounded-lg text-oasis-muted backdrop-blur-md pointer-events-none">${game.category}</span>
                            
                            <!-- Play Overlay -->
                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-slate-950/40 backdrop-blur-[2px] pointer-events-none">
                                <div class="w-10 h-10 rounded-full btn-gradient flex items-center justify-center shadow-lg"><i class="fa-solid fa-play ml-0.5"></i></div>
                            </div>
                        </div>

                        <!-- Card Info -->
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <div class="flex items-start justify-between">
                                    <h3 class="font-bold text-white text-sm group-hover:text-cyan-400 transition-colors cursor-pointer" onclick="launchGame('${game.id}')">
                                        <i class="fa-solid ${game.icon} text-xs text-oasis-muted mr-1.5"></i>${game.title}
                                    </h3>
                                    <button onclick="toggleFavorite('${game.id}', event)" class="text-slate-400 hover:text-cyan-400 transition-colors p-1">
                                        <i class="${isFav ? 'fa-solid text-cyan-400' : 'fa-regular'} fa-bookmark"></i>
                                    </button>
                                </div>
                                <p class="text-xs text-oasis-muted line-clamp-2 mt-1 leading-relaxed">${game.description}</p>
                            </div>
                            <div class="pt-2 border-t border-oasis-border/60 flex items-center justify-between text-xs">
                                <span class="font-mono text-[10px] text-slate-500 truncate mr-2">${game.path}</span>
                                <button onclick="launchGame('${game.id}')" class="text-cyan-400 font-semibold hover:underline text-xs whitespace-nowrap">Launch <i class="fa-solid fa-arrow-right text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* ==========================================================================
           5. GAME LAUNCHER & MODAL LOGIC (FIXED)
           ========================================================================== */
        function launchGame(gameId) {
            const game = GAMES_DATABASE.find(g => g.id === gameId);
            if (!game) return;

            playSound('open');
            state.activeModalGameId = gameId;

            // Setup UI
            document.getElementById('modalGameTitle').textContent = game.title;
            document.getElementById('modalGamePath').textContent = game.path;
            document.getElementById('modalGameIcon').className = `fa-solid ${game.icon}`;
            updateModalFavIcon();

            // Show Modal & Loader
            const modal = document.getElementById('gameModal');
            const iframe = document.getElementById('gameIframe');
            const loader = document.getElementById('iframeLoader');
            
            loader.classList.remove('hidden');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            
            // Set source to launch
            iframe.src = game.path;
            iframe.onload = () => loader.classList.add('hidden');
        }

        function closeGameModal() {
            playSound('click');
            const modal = document.getElementById('gameModal');
            const iframe = document.getElementById('gameIframe');
            
            // Hide modal
            modal.classList.add('opacity-0', 'pointer-events-none');
            
            // CRITICAL: Stop game execution & audio by clearing the iframe src
            setTimeout(() => { iframe.src = 'about:blank'; }, 200); 
            
            state.activeModalGameId = null;
            
            // Safely exit fullscreen if closing via other means
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function reloadIframe() {
            playSound('click');
            const iframe = document.getElementById('gameIframe');
            if (iframe.src && iframe.src !== 'about:blank' && iframe.src !== window.location.href) {
                document.getElementById('iframeLoader').classList.remove('hidden');
                iframe.src = iframe.src;
            }
        }

        function toggleFullscreen() {
            playSound('click');
            const modal = document.getElementById('modalContainer');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (modal.requestFullscreen) {
                    modal.requestFullscreen();
                } else if (modal.webkitRequestFullscreen) { /* Safari */
                    modal.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                }
            }
        }

        function playRandomGame() {
            const idx = Math.floor(Math.random() * GAMES_DATABASE.length);
            launchGame(GAMES_DATABASE[idx].id);
        }

        /* ==========================================================================
           6. FAVORITES
           ========================================================================== */
        function toggleFavorite(id, event) {
            if(event) event.stopPropagation();
            playSound('click');
            if (state.favorites.includes(id)) {
                state.favorites = state.favorites.filter(fid => fid !== id);
            } else {
                state.favorites.push(id);
            }
            localStorage.setItem('oasis_favs', JSON.stringify(state.favorites));
            updateFavBadge();
            renderGames();
            if(state.activeModalGameId === id) updateModalFavIcon();
        }

        function toggleFavoriteFromModal() {
            if(state.activeModalGameId) toggleFavorite(state.activeModalGameId, null);
        }

        function updateModalFavIcon() {
            const icon = document.getElementById('modalFavIcon');
            if(icon && state.activeModalGameId) {
                const isFav = state.favorites.includes(state.activeModalGameId);
                icon.className = `${isFav ? 'fa-solid text-cyan-400' : 'fa-regular text-slate-300'} fa-bookmark text-xs`;
            }
        }

        /* ==========================================================================
           7. SEARCH & EVENT LISTENERS
           ========================================================================== */
        function setupSearch() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            input.addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                clearBtn.classList.toggle('hidden', !state.searchQuery);
                renderGames();
            });
        }
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            state.searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderGames();
        }

        function toggleMobileSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

        /* Custom URL Launching */
        function openCustomUrlModal() {
            playSound('open');
            document.getElementById('customUrlModal').classList.remove('opacity-0', 'pointer-events-none');
        }
        function closeCustomUrlModal() {
            playSound('click');
            document.getElementById('customUrlModal').classList.add('opacity-0', 'pointer-events-none');
        }
        function submitCustomUrl() {
            const title = document.getElementById('customGameTitle').value || 'Custom App';
            const url = document.getElementById('customGameUrl').value;
            if(!url) return;
            closeCustomUrlModal();
            
            state.activeModalGameId = 'custom';
            document.getElementById('modalGameTitle').textContent = title;
            document.getElementById('modalGamePath').textContent = url;
            document.getElementById('modalGameIcon').className = 'fa-solid fa-link';
            
            const modal = document.getElementById('gameModal');
            const iframe = document.getElementById('gameIframe');
            document.getElementById('iframeLoader').classList.remove('hidden');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            
            iframe.src = url;
            iframe.onload = () => document.getElementById('iframeLoader').classList.add('hidden');
        }

        /* robust Esc and Overlay click handlers for closing modals */
        function setupModalOverlays() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    // Prevent closing the modal on the first Esc if we are currently in Fullscreen mode.
                    // The browser uses the first Esc to natively exit Fullscreen.
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        return;
                    }
                    closeGameModal();
                    closeCustomUrlModal();
                }
            });
            
            // Close game modal on outside click
            document.getElementById('gameModal').addEventListener('click', (e) => {
                if (e.target.id === 'gameModal') closeGameModal();
            });

            // Close custom URL modal on outside click
            document.getElementById('customUrlModal').addEventListener('click', (e) => {
                if (e.target.id === 'customUrlModal') closeCustomUrlModal();
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
