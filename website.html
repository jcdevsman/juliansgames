<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>classlink.dev</title>

<style>
:root {
    /* Aurora Theme Colors */
    --bg-base: #02040a;         /* Deep night sky */
    --bg-sidebar: #050814;
    --bg-workspace: #080c1a;
    --bg-panel: #0d1326;
    --bg-hover: #16203d;
    
    --text-main: #f8fafc;
    --text-muted: #8b9bb4;
    
    /* Aurora Accents (Cyan, Green, Purple) */
    --accent-cyan: #00f0ff;
    --accent-green: #00ff88;
    --accent-purple: #b026ff;
    
    --accent-gradient: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    --accent-gradient-hover: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
    
    --accent-glow-cyan: rgba(0, 240, 255, 0.4);
    --accent-glow-purple: rgba(176, 38, 255, 0.4);
    
    --border-radius-modular: 16px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
    background: var(--bg-base);
    color: var(--text-main);
    overflow: hidden;
    display: flex;
    height: 100vh;
    width: 100vw;
}

/* BACKGROUND PARTICLE CANVAS */
canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0.6; /* Increased opacity to show off the aurora colors */
}

/* SIDEBAR */
.sidebar {
    width: 64px;
    height: 100vh;
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    gap: 20px;
    z-index: 200;
    border-right: 1px solid rgba(255, 255, 255, 0.03);
    box-shadow: 2px 0 20px rgba(0, 240, 255, 0.05);
}

.sidebar-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s ease;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.2rem;
    position: relative;
}

.sidebar-icon:hover {
    background: var(--bg-hover);
    color: var(--accent-cyan);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
}

.sidebar-icon.active {
    background: var(--accent-gradient);
    color: #fff;
    box-shadow: 0 0 20px var(--accent-glow-cyan);
}

.sidebar-icon img {
    width: 24px;
    height: 24px;
    border-radius: 6px;
}

/* SIDEBAR APP PANEL */
.app-panel {
    position: fixed;
    left: -1000px;
    top: 10px;
    bottom: 10px;
    width: 550px;
    background: rgba(13, 19, 38, 0.85);
    backdrop-filter: blur(20px);
    border-radius: var(--border-radius-modular);
    z-index: 150;
    box-shadow: 10px 0 30px rgba(0,0,0,0.6), 0 0 15px rgba(176, 38, 255, 0.1);
    border: 1px solid rgba(176, 38, 255, 0.2);
    transition: left 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.app-panel.open {
    left: 75px;
}

.app-panel-header {
    padding: 15px;
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    color: var(--accent-cyan);
}

.app-panel iframe {
    flex-grow: 1;
    width: 100%;
    border: none;
    background: #fff;
}

/* MODULAR WORKSPACE (Main Content) */
.workspace-wrapper {
    flex-grow: 1;
    height: 100vh;
    padding: 10px;
    display: flex;
    flex-direction: column;
}

.workspace {
    background: rgba(8, 12, 26, 0.7);
    backdrop-filter: blur(10px);
    border-radius: var(--border-radius-modular);
    flex-grow: 1;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.workspace::-webkit-scrollbar { width: 8px; }
.workspace::-webkit-scrollbar-thumb {
    background: var(--bg-hover);
    border-radius: 10px;
}

/* TOP NAVIGATION */
.topbar {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 40px;
    background: rgba(8, 12, 26, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 100;
}

/* LOGO & BADGE */
.logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    font-size: 1.5rem;
    font-weight: 800;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}

.tier-badge {
    background: var(--accent-gradient);
    color: white;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 8px;
    border-radius: 6px;
    box-shadow: 0 0 10px var(--accent-glow-purple);
}

.search-container {
    flex: 1;
    display: flex;
    justify-content: center;
    max-width: 500px;
    margin: 0 20px;
}

.search {
    width: 100%;
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(0, 0, 0, 0.4);
    color: var(--text-main);
    font-size: 0.95rem;
    transition: 0.3s ease;
}

.search:focus {
    outline: none;
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px var(--accent-glow-cyan);
    background: rgba(0, 0, 0, 0.6);
}

/* MAIN CONTENT CONTAINER */
.container {
    max-width: 1400px;
    margin: auto;
    padding: 30px 40px;
}

/* SECTION TITLES */
.section-title {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.section-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 20px;
    background: var(--accent-gradient);
    border-radius: 2px;
}

/* GAMES GRID */
.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
}

/* GAME CARD */
.game {
    background: var(--bg-panel);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    flex-direction: column;
    padding: 15px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
}

.game::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--accent-gradient);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 0;
}

.game > * {
    position: relative;
    z-index: 1;
}

.game img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    transition: 0.3s ease;
}

.game-info {
    text-align: left;
}

.game-info .title {
    font-weight: 600;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.game-info .category {
    font-size: 0.8rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
}

.game:hover {
    transform: translateY(-5px) scale(1.02);
    border-color: transparent;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 15px rgba(0, 240, 255, 0.2);
}

.game:hover::before {
    opacity: 0.1; /* Slight glowing aurora wash on hover */
}

/* VIEWER / MODAL */
.viewer {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 10, 0.9);
    backdrop-filter: blur(20px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
}

.viewer.active {
    opacity: 1;
    pointer-events: all;
}

.viewer-content {
    width: 95%;
    max-width: 1600px;
    height: 90%;
    display: flex;
    gap: 30px;
    transform: scale(0.95) translateY(20px);
    opacity: 0;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.viewer.active .viewer-content {
    transform: scale(1) translateY(0);
    opacity: 1;
}

/* LEFT (PLAYER + INFO) */
.player-section {
    flex: 3;
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border-radius: var(--border-radius-modular);
    padding: 20px;
    border: 1px solid rgba(176, 38, 255, 0.15);
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

/* PLAYER */
.player {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    flex-grow: 1;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 240, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

#videoWrapper {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
    display: none;
}

#adVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none; 
}

.video-notice {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,0.8);
    padding: 8px 15px;
    border-radius: 8px;
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    font-weight: 600;
    z-index: 10;
    display: none;
    box-shadow: 0 0 10px var(--accent-glow-cyan);
}

/* INFO */
.info {
    margin-top: 20px;
    padding: 10px;
}

.info h2 {
    font-size: 2rem;
    margin-bottom: 5px;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.info small {
    display: inline-block;
    color: var(--text-muted);
    margin-bottom: 15px;
    font-size: 0.9rem;
}

.info p {
    color: #e0e0e0;
    font-size: 1rem;
    line-height: 1.5;
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 15px;
}

.btn-secondary:hover {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px var(--accent-glow-cyan);
}

/* RIGHT (SUGGESTIONS) */
.suggestions {
    flex: 1;
    background: var(--bg-panel);
    border-radius: var(--border-radius-modular);
    padding: 20px;
    border: 1px solid rgba(0, 240, 255, 0.15);
    display: flex;
    flex-direction: column;
}

.suggestions h3 {
    margin-bottom: 20px;
    font-size: 1.2rem;
    color: var(--text-main);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
}

.suggestions-list {
    overflow-y: auto;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding-right: 10px;
}

/* BUTTONS */
.icon-btn {
    position: absolute;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: 0.3s;
    z-index: 20;
}

.icon-btn:hover {
    background: var(--accent-gradient);
    border-color: transparent;
    box-shadow: 0 0 15px var(--accent-glow-purple);
}

.fullscreen-btn { top: 15px; right: 15px; }

.close-btn {
    top: 20px;
    right: 30px;
    position: fixed;
    width: 50px;
    height: 50px;
    font-size: 1.5rem;
    border-radius: 50%;
}

@media (max-width: 900px) {
    .viewer-content { flex-direction: column; height: 100%; overflow-y: auto; padding-top: 60px;}
    .player { aspect-ratio: 16/9; flex-grow: 0; }
    .sidebar { width: 50px; }
    .app-panel { width: 300px; }
}
</style>
</head>

/* APP PANEL TOGGLE LOGIC */
function toggleAppPanel() {
    const panel = document.getElementById("appPanel");
    panel.classList.toggle("open");

/* RAW HTML5 AD LOGIC */
const adVideo = document.getElementById("adVideo");
let currentGameToLoad = null;

const DIRECT_MP4_URL = ""; 
adVideo.src = DIRECT_MP4_URL;

adVideo.addEventListener("ended", finishVideoAndLoadGame);
adVideo.addEventListener("error", finishVideoAndLoadGame);

function finishVideoAndLoadGame() {
    document.getElementById("videoWrapper").style.display = "none";
    document.getElementById("videoNotice").style.display = "none";
    document.getElementById("gameFrame").style.display = "block";
    document.getElementById("newTabBtn").style.display = "inline-block";

    if (currentGameToLoad) {
        document.getElementById("gameFrame").src = currentGameToLoad.url;
    }
}

function openInNewTab() {
    if (!currentGameToLoad) return;
    window.open(currentGameToLoad.url, '_blank');
    closeViewer(); 
}

/* AURORA BACKGROUND ANIMATION */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let particles = [];

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

for (let i = 0; i < 150; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        for (let o of particles) {
            let dx = p.x - o.x, dy = p.y - o.y;
            let d = Math.sqrt(dx * dx + dy * dy);
            if (d < 160) {
                // Create an Aurora Gradient for the connecting lines
                let alpha = 0.2 * (1 - d / 160);
                let gradient = ctx.createLinearGradient(p.x, p.y, o.x, o.y);
                gradient.addColorStop(0, `rgba(0, 240, 255, ${alpha})`);   /* Cyan */
                gradient.addColorStop(0.5, `rgba(0, 255, 136, ${alpha})`); /* Emerald Green */
                gradient.addColorStop(1, `rgba(176, 38, 255, ${alpha})`);  /* Purple */
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(o.x, o.y);
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animate);
}
animate();

function renderGames(list, containerId) {
    const c = document.getElementById(containerId);
    if (!c) return;
    c.innerHTML = "";
    list.forEach(g => {
        const el = document.createElement("div");
        el.className = "game";
        el.innerHTML = `
            <img src="${g.icon}" alt="${g.title}">
            <div class="game-info">
                <div class="title">${g.title}</div>
                <div class="category">${g.category}</div>
            </div>
        `;
        
        el.onclick = () => {
            if (g.exclusive) {
                alert("Sorry, this is for ULTIMATE users only!");
            } else {
                openGame(g);
            }
        };
        c.appendChild(el);
    });
}

const exclusiveList = games.filter(g => g.exclusive === true);
const standardList = games.filter(g => g.exclusive !== true);

renderGames(exclusiveList, "exclusiveGames");
renderGames(standardList, "allGames");

function openGame(game) {
    const viewer = document.getElementById("viewer");
    document.getElementById("gameTitle").innerText = game.title;
    document.getElementById("gameAuthor").innerText = "Published by " + game.author;
    document.getElementById("gameDesc").innerText = game.description;
    
    document.getElementById("gameFrame").src = ""; 
    document.getElementById("newTabBtn").style.display = "none";
    
    viewer.classList.add("active");
    renderSuggested(game);
    currentGameToLoad = game;
    document.getElementById("gameFrame").style.display = "none";
    document.getElementById("videoWrapper").style.display = "block";
    document.getElementById("videoNotice").style.display = "block";
    adVideo.currentTime = 0;
    adVideo.play().catch(() => finishVideoAndLoadGame());
}

function closeViewer() {
    const viewer = document.getElementById("viewer");
    viewer.classList.remove("active");
    adVideo.pause();
    document.getElementById("videoWrapper").style.display = "none";
    document.getElementById("videoNotice").style.display = "none";
    document.getElementById("newTabBtn").style.display = "none";
    
    setTimeout(() => { document.getElementById("gameFrame").src = ""; }, 300); 
}

function renderSuggested(current) {
    const c = document.getElementById("suggestedGames");
    c.innerHTML = "";
    games.filter(g => g.category === current.category && g.title !== current.title)
        .forEach(g => {
            const el = document.createElement("div");
            el.className = "game";
            el.innerHTML = `<img src="${g.icon}"><div class="game-info"><div class="title">${g.title}</div></div>`;
            
            el.onclick = () => {
                if (g.exclusive) {
                    alert("Sorry, this is for ULTIMATE users only!");
                } else {
                    openGame(g);
                }
            };
            c.appendChild(el);
        });
}

function toggleFullscreen() {
    const el = document.getElementById("playerBox");
    if (!document.fullscreenElement) el.requestFullscreen();
    else document.exitFullscreen();
}

const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();
    const filtered = standardList.filter(g =>
        g.title.toLowerCase().includes(query) ||
        g.category.toLowerCase().includes(query)
    );
    renderGames(filtered, "allGames");
});
</script>
